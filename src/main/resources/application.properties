spring.application.name=contactbook
server.address=127.0.0.1
server.port=8080
# File database: contacts survive application restarts.
spring.datasource.url=jdbc:h2:file:./data/contactbook;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
server.error.include-message=never
